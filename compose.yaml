# SecSSO — Authentik as the SecRouter suite's optional identity provider.
# Standard Authentik topology (server + worker + postgres + redis). Blueprints under
# ./blueprints are auto-discovered and applied, pre-wiring the suite's OIDC apps.
#
#   cp .env.example .env && edit    # set AUTHENTIK_SECRET_KEY, PG_PASS, bootstrap token
#   ./bootstrap/secsso.sh up
name: secsso

services:
  postgresql:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
    volumes:
      - database:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:?set PG_PASS in .env}
      POSTGRES_USER: ${PG_USER:-authentik}
      POSTGRES_DB: ${PG_DB:-authentik}

  redis:
    image: docker.io/library/redis:alpine
    command: --save 60 1 --loglevel warning
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 30s
      timeout: 3s
      retries: 5
    volumes:
      - redis:/data

  server:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2024.12}
    restart: unless-stopped
    command: server
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 20s
      retries: 6
      start_period: 60s
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?set AUTHENTIK_SECRET_KEY in .env}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:?set PG_PASS}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@secrouter.local}
      # Read by blueprints/secagent-service.yaml's `!Env` — compose only passes through .env
      # keys a service's `environment:` block explicitly lists, so this must be here even
      # though the value itself lives in .env (see SECAGENT_SERVICE_CLIENT_SECRET there).
      SECAGENT_SERVICE_CLIENT_SECRET: ${SECAGENT_SERVICE_CLIENT_SECRET:-}
      # SecChat (native, experimental) — read by blueprints/secchatng.yaml's `!Env`.
      SECCHATNG_OIDC_CLIENT_SECRET: ${SECCHATNG_OIDC_CLIENT_SECRET:-}
      # secchatng's OIDC callback + launch URL — SecDeploy writes these into .env from the topology
      # so the blueprint registers the redirect_uri for wherever secchatng is actually fronted
      # (else the blueprint's `!Env` falls back to the sec.internal default and login 400s).
      SECCHATNG_REDIRECT_URI: ${SECCHATNG_REDIRECT_URI:-}
      SECCHATNG_LAUNCH_URL: ${SECCHATNG_LAUNCH_URL:-}
      # SecRecorder (transcription) — read by blueprints/secrecorder.yaml's `!Env`.
      SECRECORDER_OIDC_CLIENT_SECRET: ${SECRECORDER_OIDC_CLIENT_SECRET:-}
      # secrecorder's OIDC callback + launch URL — SecDeploy writes these into .env from the topology
      # so the blueprint registers the redirect_uri for wherever secrecorder is actually fronted
      # (else the blueprint's `!Env` falls back to the sec.internal default and login 400s).
      SECRECORDER_REDIRECT_URI: ${SECRECORDER_REDIRECT_URI:-}
      SECRECORDER_LAUNCH_URL: ${SECRECORDER_LAUNCH_URL:-}
      # secllm admin OIDC login client (blueprints/secllm.yaml) — gates SecLLM's /admin console only.
      SECLLM_OIDC_CLIENT_SECRET: ${SECLLM_OIDC_CLIENT_SECRET:-}
      SECLLM_REDIRECT_URI: ${SECLLM_REDIRECT_URI:-}
      SECLLM_LAUNCH_URL: ${SECLLM_LAUNCH_URL:-}
    volumes:
      - ./blueprints:/blueprints/secsso:ro
      - media:/media
      # Suite brand assets, served read-only at /media/secsso/* (referenced by
      # blueprints/branding.yaml). A nested bind over the named `media` volume, so
      # Authentik keeps its own runtime media while our logo/favicon/background ship
      # from the repo — no outbound fetch, which matters for air-gapped installs.
      - ./media:/media/secsso:ro
    ports:
      - "${SECSSO_HTTP_PORT:-9000}:9000"
      - "${SECSSO_HTTPS_PORT:-9443}:9443"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2024.12}
    restart: unless-stopped
    command: worker
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 20s
      retries: 6
      start_period: 60s
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?set AUTHENTIK_SECRET_KEY in .env}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:?set PG_PASS}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@secrouter.local}
      # Read by blueprints/secagent-service.yaml's `!Env` — compose only passes through .env
      # keys a service's `environment:` block explicitly lists, so this must be here even
      # though the value itself lives in .env (see SECAGENT_SERVICE_CLIENT_SECRET there).
      SECAGENT_SERVICE_CLIENT_SECRET: ${SECAGENT_SERVICE_CLIENT_SECRET:-}
      # SecChat (native, experimental) — read by blueprints/secchatng.yaml's `!Env`.
      SECCHATNG_OIDC_CLIENT_SECRET: ${SECCHATNG_OIDC_CLIENT_SECRET:-}
      # secchatng's OIDC callback + launch URL — SecDeploy writes these into .env from the topology
      # so the blueprint registers the redirect_uri for wherever secchatng is actually fronted
      # (else the blueprint's `!Env` falls back to the sec.internal default and login 400s).
      SECCHATNG_REDIRECT_URI: ${SECCHATNG_REDIRECT_URI:-}
      SECCHATNG_LAUNCH_URL: ${SECCHATNG_LAUNCH_URL:-}
      # SecRecorder (transcription) — read by blueprints/secrecorder.yaml's `!Env`.
      SECRECORDER_OIDC_CLIENT_SECRET: ${SECRECORDER_OIDC_CLIENT_SECRET:-}
      # secrecorder's OIDC callback + launch URL — SecDeploy writes these into .env from the topology
      # so the blueprint registers the redirect_uri for wherever secrecorder is actually fronted
      # (else the blueprint's `!Env` falls back to the sec.internal default and login 400s).
      SECRECORDER_REDIRECT_URI: ${SECRECORDER_REDIRECT_URI:-}
      SECRECORDER_LAUNCH_URL: ${SECRECORDER_LAUNCH_URL:-}
      # secllm admin OIDC login client (blueprints/secllm.yaml) — gates SecLLM's /admin console only.
      SECLLM_OIDC_CLIENT_SECRET: ${SECLLM_OIDC_CLIENT_SECRET:-}
      SECLLM_REDIRECT_URI: ${SECLLM_REDIRECT_URI:-}
      SECLLM_LAUNCH_URL: ${SECLLM_LAUNCH_URL:-}
    volumes:
      - ./blueprints:/blueprints/secsso:ro
      - media:/media
      # Suite brand assets, served read-only at /media/secsso/* (referenced by
      # blueprints/branding.yaml). A nested bind over the named `media` volume, so
      # Authentik keeps its own runtime media while our logo/favicon/background ship
      # from the repo — no outbound fetch, which matters for air-gapped installs.
      - ./media:/media/secsso:ro
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  database:
  redis:
  media:
