# SecSSO blueprint — brand the default login/consent experience as SecSSO.
# Targets Authentik 2024.x (the `authentik_brands.brand` model; earlier releases used
# `authentik_tenants.tenant`). Upload your own logo/favicon and repoint the paths below.
#
# `identifiers.domain: authentik-default` is NOT a real hostname to match against — it's this
# blueprint's OWN idempotency key (Authentik resolves a Brand for an incoming request by an
# EXACT `domain` match against the request's actual Host header, or by `default: true` as the
# catch-all). Since no request's Host is literally "authentik-default", and this row was never
# marked `default`, it never actually applied to live traffic — confirmed live: the browser's
# own tab title stayed the stock "authentik", and Authentik's server log showed
# `"brand": "<Brand: Brand fallback>"` (its own in-memory, unconfigured default) for every
# request to secsso.sec.internal, not this row. `default: true` is what actually activates it
# as the fallback for THIS single-tenant instance (no other brand ever competes for that flag).
#
# flow_device_code: REQUIRED for the OAuth2 device-authorization flow (RFC 8628 — `secagent
# login` / secagent-pi.yaml) to work at all — confirmed live (not from docs) that Authentik's
# DeviceEntryView 404s for any AUTHENTICATED request to /device when the resolved brand has no
# flow_device_code, even though every OTHER flow_* field on Brand has an internal fallback and
# works fine unset. Unauthenticated requests never hit this — they short-circuit at the view's
# login_required wrapper and redirect to login first, which is why the bug only shows up
# post-login. Points at the same consent flow already used for authorization_flow on
# secagent-pi.yaml/secagent-service.yaml/secrouter-oidc.yaml's providers.
version: 1
metadata:
  name: "SecSSO — Branding"
entries:
  # ── Suite branding on the login + consent journey ──────────────────────────────────
  # Patch the two built-in flows every sign-in passes through so the login page carries the
  # SecRouter hexagon lattice instead of Authentik's stock photo. These slugs ship with every
  # Authentik install (the providers already `!Find` the consent one), so this is an update,
  # not a create — only `background` is touched. If a deployment renamed its default flows,
  # repoint the slugs (or drop these two entries).
  - model: authentik_flows.flow
    identifiers:
      slug: default-authentication-flow
    attrs:
      background: "/media/secsso/secsso-background.svg"

  - model: authentik_flows.flow
    identifiers:
      slug: default-provider-authorization-explicit-consent
    attrs:
      background: "/media/secsso/secsso-background.svg"

  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
    attrs:
      default: true
      branding_title: "SecSSO"
      # Real suite assets, served from /media/secsso by compose.yaml's read-only bind (not
      # Authentik's bundled /static icons). Theme-adaptive SVGs — see secsso/media.
      branding_logo: "/media/secsso/secsso-logo.svg"
      branding_favicon: "/media/secsso/secsso-icon.svg"
      flow_device_code: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
