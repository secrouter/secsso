# SecSSO blueprint — brand the default login/consent experience as SecSSO, and enable the
# OAuth2 device-authorization ("device code") grant instance-wide.
# Targets Authentik 2024.x (the `authentik_brands.brand` model; earlier releases used
# `authentik_tenants.tenant`). Upload your own logo/favicon and repoint the paths below.
#
# Device code is a *brand*-level, instance-wide setting in the 2024.x line — there's no
# per-provider on/off switch until later Authentik releases. The flow below is what makes
# /application/o/device/ issue codes at all; blueprints/secagent-pi.yaml (the pi CLI client)
# is its only consumer today, but enabling it here makes device-code available to every
# OAuth2 client in this Authentik, not just that one — there's nothing in this schema
# version to scope it further with.
# See: https://docs.goauthentik.io/add-secure-apps/providers/oauth2/device_code/
version: 1
metadata:
  name: "SecSSO — Branding"
entries:
  - model: authentik_flows.flow
    id: flow-device-code
    identifiers:
      slug: secsso-device-code
    attrs:
      name: SecSSO Device Code
      title: "Authorize this device"
      designation: stage_configuration
      # The device-code verification screen identifies the approving user, so Authentik
      # requires a session to already exist before it runs.
      authentication: require_authenticated

  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
    attrs:
      branding_title: "SecSSO"
      branding_logo: "/static/dist/assets/icons/icon_left_brand.svg"
      branding_favicon: "/static/dist/assets/icons/icon.png"
      flow_device_code: !KeyOf flow-device-code
