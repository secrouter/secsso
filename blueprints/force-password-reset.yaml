# SecSSO blueprint — force a password reset on a user's NEXT login.
#
# Reusable infra for the suite's declared-user onboarding: SecDeploy generates
# blueprints/users.generated.yaml with each account carrying `attributes.reset_password: true`
# (a random initial password), and THIS blueprint makes that attribute actually gate the login —
# on first sign-in the user is forced to set a new password before proceeding.
#
# Mechanism (per Authentik docs, users-sources/user/password_reset_on_login): an Expression
# Policy checks the `reset_password` attribute and gates a Prompt + User-Write stage injected
# into the default authentication flow; a second policy clears the flag once the new password is
# written, so it only ever fires once per account.
#
# Validated end-to-end on Authentik 2026.x: a flagged user is prompted, the new password is
# actually written (a `password_set` event is the proof — the flag clearing on its own is NOT,
# see field_key below), the flag clears, and the NEXT login passes straight through.
#
# The flow-stage/policy binding semantics are the version-sensitive part — VALIDATE ON APPLY
# against the pinned AUTHENTIK_TAG, and adjust the binding `order`/`re_evaluate_policies` if
# your default flow differs. Absent this blueprint, `reset_password` is just an inert attribute.
#
# Note this binds stages into the SHARED default authentication flow, so a mistake here locks
# out every user, not just flagged ones. Recovery is to delete the two `secsso-force-reset-*`
# flow-stage bindings (authentik admin → Flows → default-authentication-flow → Stage Bindings),
# which returns the flow to stock.
version: 1
metadata:
  name: "SecSSO — Force password reset on next login"
  labels:
    blueprints.goauthentik.io/description: "Gate login on the reset_password attribute; prompt for a new password once."

entries:
  # ── Prompt fields: the new password + its repeat ──
  # `field_key` MUST be `password` / `password_repeat`: authentik's UserWriteStage
  # looks for exactly those keys in the flow plan's prompt data to call
  # set_password(). Any other key (e.g. a namespaced "secsso-reset-password") is
  # collected by the prompt, not recognised by the write stage, and silently
  # DISCARDED — the user is walked through a password change that changes
  # nothing while the clear policy still marks the reset done. The prompts are
  # identified by their own `name` instead, which keeps them distinct from the
  # built-in password prompts without breaking the write.
  - model: authentik_stages_prompt.prompt
    id: field-password
    identifiers:
      name: secsso-reset-password
    attrs:
      name: secsso-reset-password
      field_key: password
      label: "New password"
      type: password
      required: true
      placeholder: "New password"
      order: 0
  - model: authentik_stages_prompt.prompt
    id: field-password-repeat
    identifiers:
      name: secsso-reset-password-repeat
    attrs:
      name: secsso-reset-password-repeat
      field_key: password_repeat
      label: "New password (repeat)"
      type: password
      required: true
      placeholder: "Repeat new password"
      order: 1

  # ── Stages: prompt for the new password, then persist it ──
  - model: authentik_stages_prompt.promptstage
    id: stage-prompt
    identifiers:
      name: secsso-force-reset-prompt
    attrs:
      name: secsso-force-reset-prompt
      fields:
        - !KeyOf field-password
        - !KeyOf field-password-repeat
  - model: authentik_stages_user_write.userwritestage
    id: stage-write
    identifiers:
      name: secsso-force-reset-write
    attrs:
      name: secsso-force-reset-write

  # ── Policies: gate on the attribute; clear it after the write ──
  - model: authentik_policies_expression.expressionpolicy
    id: policy-check
    identifiers:
      name: secsso-reset-password-check
    attrs:
      name: secsso-reset-password-check
      expression: |
        return request.context["pending_user"].attributes.get("reset_password", False) is True
  - model: authentik_policies_expression.expressionpolicy
    id: policy-clear
    identifiers:
      name: secsso-reset-password-clear
    attrs:
      name: secsso-reset-password-clear
      expression: |
        # Runs only after the check passed and the new password was prompted; clear the flag so
        # this never fires again for the account, and allow the write stage to proceed.
        request.context["pending_user"].attributes["reset_password"] = False
        return True

  # ── Inject both stages into the default authentication flow (after password validation) ──
  # policy_engine_mode MUST be `all`. It defaults to `any`, and the write binding
  # below carries TWO policies: the reset_password check, and the clear policy
  # which returns True unconditionally. Under `any` the always-true clear alone
  # satisfies the binding, so UserWriteStage runs for EVERY user on EVERY login —
  # including those who need no reset. With no prompt data in the plan the stage
  # fails "No Pending data", and authentik answers the whole flow with
  # AccessDenied: a user who has already reset can never log in again.
  # `all` requires the check to pass too, which is the actual intent.
  - model: authentik_flows.flowstagebinding
    id: binding-prompt
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !KeyOf stage-prompt
      order: 25
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: all
  - model: authentik_flows.flowstagebinding
    id: binding-write
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !KeyOf stage-write
      order: 26
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: all

  # ── Policy bindings: the check gates BOTH stages (so neither runs on a normal login); the
  #    clear runs after the check on the write binding, resetting the one-shot flag. ──
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf binding-prompt
      policy: !KeyOf policy-check
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf binding-write
      policy: !KeyOf policy-check
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf binding-write
      policy: !KeyOf policy-clear
      order: 1
