<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 68" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" role="img" aria-label="SecSSO">
  <!-- Theme-adaptive: Authentik renders this over the (dark) flow background at login and
       in the (light) user portal header. The internal media query follows the viewer's OS
       theme so one asset reads correctly on both. Mark + wordmark match secrouter_web. -->
  <style>
    .hex, .leg { stroke: #f5f3ea; }
    .legf { stroke: #f5f3ea; stroke-opacity: .4; }
    .onode, .word { fill: #f5f3ea; }
    .sub { fill: #a7ad8e; }
    .sec { fill: #aebb78; }
    .cnode { fill: #cdd6a6; }
    @media (prefers-color-scheme: light) {
      .hex, .leg { stroke: #17140d; }
      .legf { stroke: #17140d; stroke-opacity: .4; }
      .onode, .word { fill: #17140d; }
      .sub { fill: #6f7359; }
      .sec, .cnode { fill: #54672f; }
    }
  </style>
  <g transform="translate(4,5)">
    <polygon class="hex" points="24,2 44,13 44,37 24,54 4,37 4,13" fill="none" stroke-width="2" stroke-linejoin="round"/>
    <path class="leg" d="M24 28 L24 14 M24 28 L14 38 M24 28 L34 38" stroke-width="1.9"/>
    <path class="legf" d="M24 14 L14 38 M24 14 L34 38 M14 38 L34 38" stroke-width="1.4"/>
    <circle class="onode" cx="24" cy="14" r="2.7"/><circle class="onode" cx="14" cy="38" r="2.7"/><circle class="onode" cx="34" cy="38" r="2.7"/>
    <circle class="cnode" cx="24" cy="28" r="4.4"/>
  </g>
  <text x="64" y="39" font-size="30" font-weight="600" letter-spacing="1"><tspan class="sec">SEC</tspan><tspan class="word">SSO</tspan></text>
  <text x="65" y="55" font-size="9" font-weight="500" letter-spacing="3.4" class="sub">SINGLE SIGN-ON</text>
</svg>
