<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <!-- SecSSO login background. Dark olive with a faint hexagon lattice — the same motif as
       secrouter_web's hero. Rendered full-bleed behind the Authentik flow card; kept low
       contrast so form text stays legible. -->
  <defs>
    <radialGradient id="glow" cx="72%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2e3720"/>
      <stop offset="100%" stop-color="#232a16"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <!-- large hero hexagon, upper right -->
  <g transform="translate(1180,150) scale(11)" stroke="#f5f3ea" fill="none" stroke-opacity="0.07">
    <polygon points="24,2 44,13 44,37 24,54 4,37 4,13" stroke-width="0.7" stroke-linejoin="round"/>
    <path d="M24 28 L24 14 M24 28 L14 38 M24 28 L34 38 M24 14 L14 38 M24 14 L34 38 M14 38 L34 38" stroke-width="0.5"/>
  </g>
  <!-- scattered accent hexes -->
  <g stroke="#aebb78" fill="none" stroke-opacity="0.06">
    <g transform="translate(150,640) scale(4)"><polygon points="24,2 44,13 44,37 24,54 4,37 4,13" stroke-width="1.1" stroke-linejoin="round"/><circle cx="24" cy="28" r="4.4" fill="#aebb78" fill-opacity="0.10" stroke="none"/></g>
    <g transform="translate(430,120) scale(2.4)"><polygon points="24,2 44,13 44,37 24,54 4,37 4,13" stroke-width="1.4" stroke-linejoin="round"/></g>
    <g transform="translate(760,760) scale(3)"><polygon points="24,2 44,13 44,37 24,54 4,37 4,13" stroke-width="1.2" stroke-linejoin="round"/></g>
  </g>
</svg>
